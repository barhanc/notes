name: Compile Typst Documents

on:
  push:
    branches: [ master ]
    paths:
      - 'transformers.typ'
      - 'machine-learning.typ'
      - 'rl-cheatsheet.typ'
      - 'fonts/**'
      - '.github/workflows/compile-typst.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Compile PDF
        run: |
          mkdir -p archive/pdf
          typst compile --font-path fonts transformers.typ archive/pdf/transformers.pdf
          typst compile --font-path fonts machine-learning.typ archive/pdf/machine-learning.pdf
          typst compile --font-path fonts rl-cheatsheet.typ archive/pdf/rl-cheatsheet.pdf

      - name: Commit and push generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/pdf/transformers.pdf archive/pdf/machine-learning.pdf archive/pdf/rl-cheatsheet.pdf
          if git diff --staged --quiet; then
            echo "No changes in compiled PDFs"
          else
            git commit -m "Auto-compile Typst PDFs [skip ci]"
            git push
          fi
