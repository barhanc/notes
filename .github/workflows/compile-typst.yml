name: Compile Typst Documents

on:
  push:
    branches: [ master ]
    paths:
      - 'typst/**/*.typ'
      - 'research/**/*.typ'
      - 'research/**/figs/**'
      - 'assets/fonts/**'
      - '.github/workflows/compile-typst.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Compile Typst documents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p archive/pdf

          # 1. Expository notes -> archive/pdf/<name>.pdf
          if [ -d typst ]; then
            while IFS= read -r -d '' file; do
              name="$(basename "$file" .typ)"
              out="archive/pdf/${name}.pdf"
              echo "Compiling $file -> $out"
              typst compile --root . --font-path assets/fonts "$file" "$out"
            done < <(find typst -type f -name '*.typ' ! -name '_*' ! -path '*/_*/*' -print0 | sort -z)
          fi

          # 2. Research reports -> alongside source .typ (skip _*.typ helpers)
          if [ -d research ]; then
            while IFS= read -r -d '' file; do
              out="${file%.typ}.pdf"
              echo "Compiling $file -> $out"
              typst compile --root . --font-path assets/fonts "$file" "$out"
            done < <(find research -type f -name '*.typ' ! -name '_*' ! -path '*/_*/*' -print0 | sort -z)
          fi

      - name: Commit and push generated PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          find archive/pdf -maxdepth 1 -type f -name '*.pdf' -print0 | xargs -0 -r git add --
          if [ -d research ]; then
            find research -type f -name '*.pdf' ! -path '*/_*/*' -print0 | xargs -0 -r git add --
          fi

          if git diff --staged --quiet; then
            echo "No changes in compiled PDFs"
          else
            git commit -m "Auto-compile Typst PDFs [skip ci]"
            git push
          fi
